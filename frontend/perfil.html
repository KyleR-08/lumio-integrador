<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil · Lumio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <header class="header">
        <a class="brand" href="galeria.html">lumio<span class="brand__dot">•</span></a>
        <nav>
            <ul class="nav">
                <li><a class="nav__link" href="galeria.html">Explorar</a></li>
                <li><a class="nav__link" href="registro.html">Registrar</a></li>
                <li data-solo-admin><a class="nav__link" href="usuarios.html">Usuarios</a></li>
            </ul>
        </nav>
        <a class="avatar" href="perfil.html" aria-label="Mi perfil">KR</a>
    </header>

    <main class="page">
        <section class="profile">
            <span class="avatar avatar--lg" id="iniciales"></span>
            <div>
                <h1 id="nombre"></h1>
                <p><span class="dorado" id="rol"></span> · <span class="status status--ok" id="estado"></span></p>
                <p id="correo"></p>
                <a class="btn btn--gold" id="salir" href="index.html">Cerrar sesión</a>
            </div>
        </section>

        <section class="stats">
            <div class="stat"><strong id="publicaciones">0</strong> Publicaciones</div>
        </section>

        <nav class="tabs">
            <a class="nav__link nav__link--active" href="perfil.html">Publicaciones</a>
            <a class="nav__link" href="guardadas.html">Guardadas</a>
        </nav>

        <ul class="gallery" id="galeria"></ul>
    </main>

    <nav class="dock">
        <ul>
        <li><a class="dock__link" href="galeria.html" aria-label="Explorar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </a></li>
        <li><a class="dock__link" href="registro.html" aria-label="Registrar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
        </a></li>
        <li data-solo-admin><a class="dock__link" href="usuarios.html" aria-label="Usuarios">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 5 2.2 5 5"/></svg>
        </a></li>
        <li><a class="dock__link dock__link--active" href="perfil.html" aria-label="Perfil">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </a></li>
        </ul>
    </nav>
    <script>
        document.getElementById("iniciales").textContent = iniciales(usuario.nombre);
        document.getElementById("nombre").textContent = usuario.nombre;
        document.getElementById("rol").textContent = usuario.rol;
        document.getElementById("estado").textContent = usuario.estado;
        document.getElementById("correo").textContent = usuario.correo;

        document.getElementById("salir").addEventListener("click", () => {
            localStorage.removeItem("usuario");
        });

        fetch(API + "/api/imagenes/?usuario_id=" + usuario.id)
            .then((respuesta) => respuesta.json())
            .then((imagenes) => {
                const galeria = document.getElementById("galeria");
                document.getElementById("publicaciones").textContent = imagenes.length;
                imagenes.forEach((imagen) => {
                    galeria.appendChild(crearTarjeta(imagen));
                });
            });
    </script>
</body>
</html>
