<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar imagen · Lumio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="app.js"></script>
</head>
<body>
    <header class="header">
        <a class="brand" href="galeria.html"><img class="brand__logo" src="logo-uide-vino.png" alt="UIDE Powered by Arizona State University"></a>
        <nav>
            <ul class="nav">
                <li><a class="nav__link" href="galeria.html">Explorar</a></li>
                <li><a class="nav__link nav__link--active" href="registro.html">Registrar</a></li>
                <li data-solo-admin><a class="nav__link" href="usuarios.html">Usuarios</a></li>
            </ul>
        </nav>
        <a class="avatar" href="perfil.html" aria-label="Mi perfil">KR</a>
    </header>

    <main class="page page--estrecha">
        <h1>Registrar imagen</h1>
        <p class="subtitle">Añade una nueva publicación a la galería.</p>

        <form id="formulario">
            <label for="imagen">Imagen (JPG, PNG o WEBP · máximo 10 MB)</label>
            <input id="imagen" name="archivo" type="file" accept="image/jpeg,image/png,image/webp" required>

            <label for="titulo">Título o nombre</label>
            <input id="titulo" name="titulo" type="text" placeholder="Ej. Quiet workspace" required>

            <label for="categoria">Categoría</label>
            <select id="categoria" name="categoria_id" required>
                <option value="" selected disabled>Seleccionar categoría</option>
            </select>

            <label for="descripcion">Descripción</label>
            <textarea id="descripcion" name="descripcion" rows="4"></textarea>

            <button class="btn btn--gold" type="submit">Registrar imagen</button>
        </form>
        <p id="mensaje"></p>
    </main>

    <nav class="dock">
        <ul>
        <li><a class="dock__link" href="galeria.html" aria-label="Explorar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        </a></li>
        <li><a class="dock__link dock__link--active" href="registro.html" aria-label="Registrar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
        </a></li>
        <li data-solo-admin><a class="dock__link" href="usuarios.html" aria-label="Usuarios">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 5 2.2 5 5"/></svg>
        </a></li>
        <li><a class="dock__link" href="perfil.html" aria-label="Perfil">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        </a></li>
        </ul>
    </nav>
    <script>
        const formulario = document.getElementById("formulario");
        const select = document.getElementById("categoria");
        const mensaje = document.getElementById("mensaje");

        fetch(API + "/api/categorias/")
            .then((respuesta) => respuesta.json())
            .then((categorias) => {
                categorias.forEach((categoria) => {
                    const opcion = document.createElement("option");
                    opcion.value = categoria.id;
                    opcion.textContent = categoria.nombre;
                    select.appendChild(opcion);
                });
            });

        formulario.addEventListener("submit", (evento) => {
            evento.preventDefault();
            const datos = new FormData(formulario);
            datos.append("usuario_id", usuario.id);
            fetch(API + "/api/imagenes/", { method: "POST", body: datos })
                .then((respuesta) => {
                    if (respuesta.ok) {
                        window.location.href = "galeria.html";
                    } else {
                        respuesta.json().then((error) => {
                            mensaje.textContent = error.detail;
                        });
                    }
                });
        });
    </script>
</body>
</html>
